# Generated by curious
services:
  firefly-iii:
    image: fireflyiii/core:latest
    env_file:
      - ./.env
    environment:
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost
      TRUSTED_PROXIES: "**"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: secret_firefly_password
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    labels:
      shipyard.route: /
      shipyard.primary-route: "true"
  db:
    image: mariadb:lts
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: yes
      MYSQL_USER: firefly
      MYSQL_PASSWORD: secret_firefly_password
      MYSQL_DATABASE: firefly
    volumes:
      - firefly_iii_db:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "3306"
volumes:
  firefly_iii_upload:
    labels:
      shipyard.deploy.disk.size: 2Gi
  firefly_iii_db:
    labels:
      shipyard.deploy.disk.size: 5Gi
