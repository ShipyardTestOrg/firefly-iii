services:
  cb-firefly:
    image: fireflyiii/core:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    # Shipyard does not reliably inject env_file vars; the boot-critical vars
    # (app key, DB connection, cron token) are duplicated here so the container
    # can always start. Secrets use the repo's existing .env values.
    environment:
      APP_ENV: production
      APP_KEY: SomeRandomStringOf32CharsExactly
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: secret_firefly_password
      STATIC_CRON_TOKEN: PLEASE_REPLACE_WITH_32_CHAR_CODE
      APP_URL: http://localhost
      TRUSTED_PROXIES: '**'
    ports:
      - '8090:8080'
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    labels:
      shipyard.route: '/'
      shipyard.primary-route: 'true'

  db:
    image: mariadb:lts
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_USER: firefly
      MYSQL_PASSWORD: secret_firefly_password
      MYSQL_DATABASE: firefly
    volumes:
      - firefly_iii_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  firefly_iii_upload:
    labels:
      shipyard.deploy.disk.size: 2Gi
  firefly_iii_db:
    labels:
      shipyard.deploy.disk.size: 5Gi
